<body>

        <a id="logo-header" href="index.html">

            </ul>
        </nav>
    </header>

    <div id="main-content">
        <h1>Contáctanos</h1>
        <p>Llena el formulario para solicitar mayor información o detalles de nuestros equipos:</p>
        
        <form onsubmit="procesarFormulario(event)">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="asunto">Asunto:</label>
            <input type="text" id="asunto" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" rows="4" required></textarea>

            <button type="submit">Enviar mensaje</button>
        </form>

        <div id="mensajeResultado" style="margin-top: 20px; font-weight: bold; color: #2e7d32;"></div>
    </div>

    <script type="text/javascript">
        // Uso de la función concat() para unir cadenas de texto (como en el libro, pág. 91)[cite: 1]
        function procesarFormulario(event) {
            event.preventDefault();
            let nombre = document.getElementById("nombre").value;
            let asunto = document.getElementById("asunto").value;
            
            let texto1 = "Gracias, ".concat(nombre);
            let texto2 = ". Tu mensaje sobre '".concat(asunto, "' ha sido enviado con éxito.");
            let mensajeFinal = texto1.concat(texto2);
            
            document.getElementById("mensajeResultado").innerHTML = mensajeFinal;
        }
    </script>

</body>
